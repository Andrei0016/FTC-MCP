[project]
name = "ftc-mcp"
version = "0.1.0"
description = "MCP server that teaches Claude to write FTC robot code in the subsystem / action-system / base-opmode style and keeps a live codebase map."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "pyyaml>=6.0",
]

[project.scripts]
ftc-mcp = "ftc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftc_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
